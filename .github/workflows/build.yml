name: Build

on:
  push:
    branches:
      - main
      - release
      - "release/**"
  pull_request:
    branches:
      - main
      - release
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Build container image
        run: docker build --tag tofleven:${{ github.sha }} .
